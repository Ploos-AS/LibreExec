name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify host gates
        run: make clean && make check

  m68k-68000:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cross-build output
        run: mkdir -p build/m68k
      - name: Compile core for 68000
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            m68k-amigaos-gcc -m68000 -ffreestanding -Wall -Wextra -Werror -Iinclude -c src/core.c -o build/m68k/core.o
      - name: Compile Exec nucleus for 68000
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            m68k-amigaos-gcc -m68000 -ffreestanding -Wall -Wextra -Werror -Iinclude -c src/exec.c -o build/m68k/exec.o
      - name: Compile M2.0 reset entry for 68000
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            m68k-amigaos-gcc -m68000 -ffreestanding -c kernel/startup.S -o build/m68k/startup.o
      - name: Compile M2.0 kernel entry for 68000
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            m68k-amigaos-gcc -m68000 -ffreestanding -Wall -Wextra -Werror -Iinclude -c kernel/kernel.c -o build/m68k/kernel.o
      - name: Verify m68k objects
        run: |
          for f in build/m68k/core.o build/m68k/exec.o build/m68k/startup.o build/m68k/kernel.o; do
            file "$f"
            file "$f" | grep -qi 'Motorola 68000\|m68k'
          done
